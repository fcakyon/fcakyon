name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: browser-actions/setup-chrome@v2

      - name: Refresh public totals
        id: refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
        run: |
          uv run scripts/update_stats.py
          if git diff --quiet -- data/profile.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render cards and lists
        if: steps.refresh.outputs.changed == 'true'
        run: uv run scripts/render_profile.py

      - name: Commit changed totals
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile.json README.md assets/cards OPEN_SOURCE.md PAPERS.md TALKS.md PRODUCTS.md
          git commit -m "build: refresh profile stats"
          git push
